# bid.fp-desk.com — gonggong 공공입찰 통계 엔진
#
# 오리진은 127.0.0.1:8000 의 uvicorn(gonggong.service) 하나뿐이다.
# 프론트엔드(React dist)도 FastAPI 가 직접 서빙하므로 전부 한 곳으로 넘긴다.
# 클라이언트 실 IP 복원은 /etc/nginx/conf.d/cloudflare-realip.conf 가 전역 처리한다.

server {
    listen 80;
    listen [::]:80;
    server_name bid.fp-desk.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://bid.fp-desk.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bid.fp-desk.com;

    ssl_certificate     /etc/letsencrypt/live/bid.fp-desk.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bid.fp-desk.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # CSV 업로드(admin import) 여유분
    client_max_body_size 20m;

    # Cloudflare 가 Full(strict) 에서 오리진에 443 으로 붙으므로, 갱신 요청이
    # 80 이 아니라 여기로 떨어질 수 있다. 프록시 폴백보다 먼저 와야 한다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
